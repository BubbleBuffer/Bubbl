name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: git fetch origin main:refs/remotes/origin/main
      - run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: '1.85.0'
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets --all-features
      - shell: pwsh
        run: ./scripts/verify-release.ps1 -Tag "$env:GITHUB_REF_NAME"
      - run: bash -n ./install.sh
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            binary: target/x86_64-pc-windows-msvc/release/bubl.exe
            format: zip
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            binary: target/x86_64-unknown-linux-musl/release/bubl
            format: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            binary: target/x86_64-apple-darwin/release/bubl
            format: tar.gz
          - os: macos-15
            target: aarch64-apple-darwin
            binary: target/aarch64-apple-darwin/release/bubl
            format: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: '1.85.0'
          targets: ${{ matrix.target }}
      - shell: pwsh
        run: |
          $version = (Select-String -LiteralPath Cargo.toml -Pattern '^version = "([^"]+)"$').Matches[0].Groups[1].Value
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - shell: pwsh
        run: ./scripts/package-plugin.ps1 -Target '${{ matrix.target }}' -Binary '${{ matrix.binary }}' -Format '${{ matrix.format }}' -SourceCommit '${{ github.sha }}' -SourceRef '${{ github.ref }}'
      - shell: pwsh
        run: |
          $package = Get-ChildItem 'target/package' -Directory -Filter 'bubbl-*-${{ matrix.target }}' | Select-Object -First 1
          if (-not $package) { throw 'package root missing' }
          ./scripts/validate-package.ps1 -PackageRoot $package.FullName -ExpectedTarget '${{ matrix.target }}' -ExpectedCommit '${{ github.sha }}'
      - if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: ./scripts/test-installers.ps1 -Archive './dist/bubbl-${{ env.RELEASE_VERSION }}-${{ matrix.target }}.zip' -Version '${{ env.RELEASE_VERSION }}' -ExpectedCommit '${{ github.sha }}'
      - if: matrix.target == 'x86_64-unknown-linux-musl'
        run: bash ./scripts/test-install.sh './dist/bubbl-${{ env.RELEASE_VERSION }}-${{ matrix.target }}.tar.gz' '${{ github.sha }}'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bubbl-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  assemble-draft:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bubbl-*
          path: dist
          merge-multiple: true
      - shell: pwsh
        run: |
          Copy-Item -LiteralPath ./install.ps1 -Destination ./dist/install.ps1
          Copy-Item -LiteralPath ./install.sh -Destination ./dist/install.sh
          ./scripts/verify-release.ps1 -Tag "$env:GITHUB_REF_NAME" -Dist ./dist
          $lines = Get-ChildItem ./dist -File |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            }
          Set-Content -LiteralPath ./dist/SHA256SUMS.txt -Value $lines -Encoding utf8NoBOM
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            test "$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --generate-notes --title "Bubbl $GITHUB_REF_NAME"
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber

  publish:
    needs: assemble-draft
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          expected=(
            "SHA256SUMS.txt"
            "bubbl-$version-aarch64-apple-darwin.tar.gz"
            "bubbl-$version-x86_64-apple-darwin.tar.gz"
            "bubbl-$version-x86_64-pc-windows-msvc.zip"
            "bubbl-$version-x86_64-unknown-linux-musl.tar.gz"
            "install.ps1"
            "install.sh"
          )
          test "$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          mapfile -t actual < <(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | sort)
          mapfile -t wanted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${actual[*]}" = "${wanted[*]}"
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false

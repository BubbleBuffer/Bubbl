[package]
name = "bubl"
version = "1.0.4"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "One-use secret delivery for coding agents"

[dependencies]
base64 = "0.22.1"
blake3 = "1.5.5"
chacha20poly1305 = "0.10.1"
getrandom = "0.3.1"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
thiserror = "2.0.11"
zeroize = "1.8.1"

[dev-dependencies]
tempfile = "3.16.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
